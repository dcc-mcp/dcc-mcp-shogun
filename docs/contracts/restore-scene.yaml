contract_version: "1.4"
status: proposed-design-only
implementation_authorized: false

operation:
  name: restore_scene
  destructive: true
  idempotent: false
  single_use: true
  replay_allowed: false
  route: official_sdk_only

prohibited_routes: [arbitrary_hsl, python, ui_automation]

preconditions:
  - canonical_target_is_contained_by_canonical_trusted_root
  - target_is_regular_vdf_without_symlink_or_reparse_escape
  - target_basename_size_and_sha256_match_recovery_receipt
  - recovery_receipt_reports_active_scene_unchanged
  - operator_confirmation_is_fresh_exact_scope_and_unused

terminal_rules:
  poll_only_after_dispatch: true
  mutation_retry_allowed: false
  timeout_state: timed_out
  unknown_state: indeterminate
  timeout_or_unknown_effect: unknown

real_host_acceptance:
  authorized_by_this_contract: false
  requires_disposable_marked_take: true
  requires_explicit_approved_path_scope: true
  requires_separate_operator_authorization: true

confirmation_authority:
  issuer: authenticated_operator_confirmation_service
  store: trusted_adapter_local_store
  caller_supplied_records_accepted: false
  lookup_key: confirmation_id
  comparison_fields:
    - request_id
    - canonical_trusted_root_sha256
    - canonical_path_sha256
    - target_volume_serial
    - target_file_id
    - recovery_receipt_binding_sha256
  path_canonicalization: windows_handle_final_path_identity_v1
  receipt_canonicalization: nfc_sorted_compact_json_utf8_v1
  digest_algorithm: sha256_utf8_canonical_v1
  max_ttl_seconds: 300
  issuance_write: atomic_insert_if_absent
  confirmation_id_reuse: forbidden_forever
  reauthorization_requires: new_confirmation_id
  record_retention: durable_tombstone_after_expiry_or_consumption
  consume: atomic_compare_and_set_unconsumed_before_dispatch
  concurrency_invariant: consume_count_equals_dispatch_count_equals_one
  state_machine:
    - authenticated_issue_to_trusted_store
    - trusted_lookup_by_confirmation_id
    - compare_request_path_receipt_freshness_and_unconsumed
    - open_and_pin_volume_root_full_directory_chain_and_target
    - connect_host_and_capture_before_receipt
    - recapture_all_pinned_handle_identities_and_target_receipt
    - reject_any_guard_change_before_consumption
    - atomic_compare_and_set_consume
    - dispatch_volume_guid_path_while_full_chain_remains_pinned
    - official_sdk_readback_matches_guarded_confirmation_identity
  issuance_record_schema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    required:
      - record_version
      - confirmation_id
      - request_id
      - canonical_trusted_root_sha256
      - canonical_path_sha256
      - target_volume_serial
      - target_file_id
      - recovery_receipt_binding_sha256
      - issued_at_epoch_seconds
      - expires_at_epoch_seconds
      - destructive_acknowledged
      - non_idempotent_acknowledged
      - consumed
      - revision
    properties:
      record_version: {type: string, const: "1.1"}
      confirmation_id:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      request_id:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      canonical_trusted_root_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      canonical_path_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      target_volume_serial: {type: string, pattern: "^[0-9A-F]{16}$"}
      target_file_id: {type: string, pattern: "^[0-9a-f]{32}$"}
      recovery_receipt_binding_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      issued_at_epoch_seconds: {type: integer, minimum: 0}
      expires_at_epoch_seconds: {type: integer, minimum: 1}
      destructive_acknowledged: {type: boolean, const: true}
      non_idempotent_acknowledged: {type: boolean, const: true}
      consumed: {type: boolean}
      revision: {type: integer, minimum: 1}
    additionalProperties: false

canonicalization:
  windows_final_path:
    version: windows-final-path-v1
    authority: trusted_windows_handle_resolver
    final_path_source: GetFinalPathNameByHandleW_FILE_NAME_NORMALIZED
    device_identity_source: volume_serial_and_128_bit_file_id_from_open_handle
    raw_path_rules:
      - reject_device_namespace_and_alternate_data_streams
      - collapse_dot_segments_before_open
      - inspect_every_reparse_component_and_require_approved_target
      - compare_handle_derived_final_root_and_target_on_same_volume
      - require_final_target_containment_under_final_trusted_root
    final_path_normalization:
      - strip_extended_length_prefix
      - convert_extended_unc_prefix_to_unc
      - use_backslash_separator
      - unicode_nfc
      - ascii_case_fold_only
    binding_payload: |-
      windows-final-path-v1
      volume_serial={16 uppercase hex digits}
      file_id={32 lowercase hex digits}
      path={normalized handle-derived final path}
    encoding: utf-8
    digest: sha256
    golden_vectors:
      - name: unicode_dotdot_alias_same_handle_identity
        raw_aliases:
          - 'C:/Approved/shots/../shots/镜头_É.vdf'
          - 'c:\approved\shots\镜头_É.vdf'
        final_path: '\\?\C:\Approved\shots\镜头_É.vdf'
        volume_serial: 00000000A1B2C3D4
        file_id: 00112233445566778899aabbccddeeff
        canonical_utf8_hex: 77696e646f77732d66696e616c2d706174682d76310a766f6c756d655f73657269616c3d303030303030303041314232433344340a66696c655f69643d30303131323233333434353536363737383839396161626263636464656566660a706174683d633a5c617070726f7665645c73686f74735ce9959ce5a4b45fc3892e766466
        sha256: ba82b4305ccab53ae1e023659d21fee8e3361b031c6abc4a4c2d9c226986104a
      - name: unapproved_reparse_device_identity_rejected
        raw_aliases: ['C:/Approved/shots/reparse/镜头_É.vdf']
        final_path: '\\?\D:\outside\镜头_É.vdf'
        volume_serial: 00000000D4C3B2A1
        file_id: 99990000aaaabbbbccccddddeeeeffff
        disposition: reject_unapproved_reparse_or_device_identity
  recovery_receipt:
    version: recovery-receipt-json-v1
    members:
      - active_scene_changed
      - file_name
      - file_size_bytes
      - receipt_version
      - sha256
    string_normalization: unicode_nfc
    key_order: ascending_unicode_code_point
    encoding: utf-8
    ensure_ascii: false
    separators: [comma, colon]
    insignificant_whitespace: forbidden
    number_format: unsigned_base10_integer_without_leading_zero
    boolean_format: lowercase_json_literal
    digest: sha256
    golden_vectors:
      - name: unicode_filename_nfc
        receipt:
          receipt_version: 1
          file_name: 镜头_É.vdf
          file_size_bytes: 4096
          sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          active_scene_changed: false
        canonical_utf8_hex: 
        sha256: ce41a69eec6594a5511ea7d219a26bb84af1d7db033876a1124a5b7cbbe12e58
  scene_identity:
    version: official-sdk-scene-identity-json-v1
    official_sdk_calls: [GetSceneName, GetFrameCount]
    get_scene_name_tuple_rule:
      shape: exactly_two_strings_scene_path_and_name_or_path
      scene_path: absolute_windows_directory_for_saved_scene
      full_path: name_or_path_parent_must_equal_scene_path
      basename: join_name_or_path_to_scene_path
      relative_path_with_separator: reject
      scene_name: unicode_nfc_basename_of_name_or_path
      unsaved_sentinel: ['.', '.vdf']
      malformed_or_unsaved: reject_before_receipt
    field_sources:
      scene_name: GetSceneName[1].unicode_nfc_basename_after_exact_tuple_validation
      frame_count: GetFrameCount.strict_nonnegative_integer
      canonical_path_sha256: exact_derived_candidate_resolved_to_guarded_windows_final_path_identity
    members: [canonical_path_sha256, frame_count, scene_name]
    key_order: ascending_unicode_code_point
    encoding: utf-8
    ensure_ascii: false
    separators: [comma, colon]
    insignificant_whitespace: forbidden
    digest: sha256
    golden_vectors:
      - name: full_path_return_shape
        raw_get_scene_name: ['C:/Approved/recovery', 'C:/Approved/recovery/marked_take.vdf']
        raw_get_frame_count: 240
        resolver_input: 'C:\Approved\recovery\marked_take.vdf'
        handle_observation:
          final_path: '\\?\C:\Approved\recovery\marked_take.vdf'
          volume_serial: 00000000A1B2C3D4
          file_id: 00112233445566778899aabbccddeeff
        disposition: accept
        derived_identity:
          canonical_path_sha256: 77ad3c517a01f7e2351e01328083edef7159d3e5c1c8a31b9dc1e231c27b6ff9
          frame_count: 240
          scene_name: marked_take.vdf
        canonical_utf8_hex: 7b2263616e6f6e6963616c5f706174685f736861323536223a2237376164336335313761303166376532333531653031333238303833656465663731353964336535633163386133316239646331653233316332376236666639222c226672616d655f636f756e74223a3234302c227363656e655f6e616d65223a226d61726b65645f74616b652e766466227d
        sha256: 2d6934cb6e1d5e159780c6fc63f610df91e578856765ab7d7c70ec3b9defb8cb
      - name: basename_return_shape
        raw_get_scene_name: ['C:/Approved/recovery', marked_take.vdf]
        raw_get_frame_count: 240
        resolver_input: 'C:\Approved\recovery\marked_take.vdf'
        handle_observation:
          final_path: '\\?\C:\Approved\recovery\marked_take.vdf'
          volume_serial: 00000000A1B2C3D4
          file_id: 00112233445566778899aabbccddeeff
        disposition: accept
        derived_identity:
          canonical_path_sha256: 77ad3c517a01f7e2351e01328083edef7159d3e5c1c8a31b9dc1e231c27b6ff9
          frame_count: 240
          scene_name: marked_take.vdf
        canonical_utf8_hex: 7b2263616e6f6e6963616c5f706174685f736861323536223a2237376164336335313761303166376532333531653031333238303833656465663731353964336535633163386133316239646331653233316332376236666639222c226672616d655f636f756e74223a3234302c227363656e655f6e616d65223a226d61726b65645f74616b652e766466227d
        sha256: 2d6934cb6e1d5e159780c6fc63f610df91e578856765ab7d7c70ec3b9defb8cb
      - name: unicode_nfc_full_path
        raw_get_scene_name: ['C:/Approved/recovery', 'C:/Approved/recovery/镜头_É.vdf']
        raw_get_frame_count: 1
        resolver_input: 'C:\Approved\recovery\镜头_É.vdf'
        handle_observation:
          final_path: '\\?\C:\Approved\recovery\镜头_É.vdf'
          volume_serial: 00000000A1B2C3D4
          file_id: 102132435465768798a9bacbdcedfe0f
        disposition: accept
        derived_identity:
          canonical_path_sha256: ae307b5b7fb93751cf4589859caaa6a60fe096ed73b0eb5cf504519734dbfd0f
          frame_count: 1
          scene_name: 镜头_É.vdf
        canonical_utf8_hex: 7b2263616e6f6e6963616c5f706174685f736861323536223a2261653330376235623766623933373531636634353839383539636161613661363066653039366564373362306562356366353034353139373334646266643066222c226672616d655f636f756e74223a312c227363656e655f6e616d65223a22e9959ce5a4b45fc3892e766466227d
        sha256: 2e1ad1af8be0387730b0db8d4773a5902cf52799238be83a97d1e411223f2730
      - name: unsaved_dot_vdf
        raw_get_scene_name: ['.', '.vdf']
        raw_get_frame_count: 0
        disposition: reject_unsaved_scene
      - name: malformed_parent_mismatch
        raw_get_scene_name: ['C:/Approved/recovery', 'C:/Approved/other/marked_take.vdf']
        raw_get_frame_count: 240
        disposition: reject_scene_path_parent_mismatch
      - name: negative_frame_count
        raw_get_scene_name: ['C:/Approved/recovery', marked_take.vdf]
        raw_get_frame_count: -1
        disposition: reject_negative_frame_count
      - name: relative_forward_slash
        raw_get_scene_name: ['C:/Approved/recovery', 'nested/marked_take.vdf']
        raw_get_frame_count: 240
        disposition: reject_relative_path_with_separator
      - name: relative_backslash
        raw_get_scene_name: ['C:/Approved/recovery', 'nested\marked_take.vdf']
        raw_get_frame_count: 240
        disposition: reject_relative_path_with_separator
      - name: wrong_arity_one
        raw_get_scene_name: ['C:/Approved/recovery']
        raw_get_frame_count: 240
        disposition: reject_wrong_arity
      - name: wrong_arity_three
        raw_get_scene_name: ['C:/Approved/recovery', marked_take.vdf, unexpected]
        raw_get_frame_count: 240
        disposition: reject_wrong_arity
      - name: non_string_scene_path
        raw_get_scene_name: [123, marked_take.vdf]
        raw_get_frame_count: 240
        disposition: reject_non_string_tuple_member
      - name: non_string_name_or_path
        raw_get_scene_name: ['C:/Approved/recovery', 123]
        raw_get_frame_count: 240
        disposition: reject_non_string_tuple_member

target_guard:
  strategy: pin_full_windows_namespace_chain_through_dispatch
  open_api: CreateFileW
  dispatch_path_api: GetFinalPathNameByHandleW_VOLUME_NAME_GUID
  directory_desired_access: [FILE_READ_ATTRIBUTES]
  directory_flags: [FILE_FLAG_BACKUP_SEMANTICS, FILE_FLAG_OPEN_REPARSE_POINT]
  target_desired_access: [GENERIC_READ, FILE_READ_ATTRIBUTES]
  share_mode: [FILE_SHARE_READ]
  creation_disposition: OPEN_EXISTING
  pinned_objects:
    - volume_root
    - every_directory_component_including_trusted_root
    - target_file
  deny_conflicting_access: [write, delete, rename, replace]
  identity_fields: [canonical_path_sha256, volume_serial, file_id]
  dispatch_path: volume_guid_final_path_derived_from_pinned_target
  sdk_dispatch: path_only_while_entire_namespace_chain_remains_pinned
  hold_from: before_first_namespace_identity_capture
  hold_until: terminal_official_sdk_readback_or_unknown_effect
  validation_checkpoints:
    - after_official_sdk_before_receipt_capture_completed
    - after_all_pinned_handle_and_target_receipt_recapture
    - immediately_before_confirmation_cas
    - dispatch_entry_before_confirmation_cas_with_full_chain_still_held
  predispatch_recapture: all_pinned_handle_identities_and_target_receipt_immediately_before_confirmation_cas
  change_before_cas: target_guard_rejected_without_consume_or_dispatch
  swap_attempt_while_pinned: blocked_by_windows_share_contract
  adversarial_proof:
    phases: [preflight, recapture, cas, dispatch]
    swap_kinds: [namespace, junction, parent, same_content]
    predispatch_change_invariant: consume_count_equals_dispatch_count_equals_zero
  windows_integration_proof:
    platform: windows_ci_real_filesystem
    sdk_boundary: CreateFileW_reopens_volume_guid_path
    retained_through_open: volume_root_every_directory_and_target_handles
    identity_assertion: reopened_volume_serial_and_128_bit_file_id_equal_confirmed_target
    attack_kinds: [target, parent, junction, namespace, same_content]
    attack_outcome_while_retained: windows_sharing_violation_and_confirmed_identity_loaded
    control_after_release: same_swap_succeeds_and_path_identity_changes
    real_shogun_invoked: false
  readback_match: official_sdk_active_scene_to_guarded_confirmation_identity

input_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://github.com/dcc-mcp/dcc-mcp-shogun/docs/contracts/restore-scene-input.schema.json
  title: Proposed recovery-scene restore request
  type: object
  required: [request_id, trusted_root, file_path, recovery_receipt, operator_confirmation]
  properties:
    request_id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
    trusted_root:
      type: string
      minLength: 3
      maxLength: 4096
      pattern: "^[A-Za-z]:[\\\\/].+"
    file_path:
      type: string
      minLength: 7
      maxLength: 4096
      pattern: "^[A-Za-z]:[\\\\/].+\\.[vV][dD][fF]$"
    recovery_receipt: {$ref: "#/$defs/recovery_receipt"}
    operator_confirmation:
      type: object
      required: [confirmation_id]
      properties:
        confirmation_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      additionalProperties: false
  additionalProperties: false
  $defs:
    recovery_receipt:
      type: object
      required: [receipt_version, file_name, file_size_bytes, sha256, active_scene_changed]
      properties:
        receipt_version: {type: integer, const: 1}
        file_name:
          type: string
          minLength: 5
          maxLength: 255
          pattern: "^[^/\\\\]+\\.[vV][dD][fF]$"
        file_size_bytes: {type: integer, minimum: 1}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        active_scene_changed: {type: boolean, const: false}
      additionalProperties: false

output_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://github.com/dcc-mcp/dcc-mcp-shogun/docs/contracts/restore-scene-output.schema.json
  title: Proposed recovery-scene restore terminal result
  $defs:
    scene_identity_fields:
      type: object
      required: [canonical_path_sha256, frame_count, scene_name]
      properties:
        canonical_path_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        frame_count: {type: integer, minimum: 0}
        scene_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[^/\\\\]+$"
      additionalProperties: false
    target_identity:
      type: object
      required: [canonical_path_sha256, volume_serial, file_id]
      properties:
        canonical_path_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        volume_serial: {type: string, pattern: "^[0-9A-F]{16}$"}
        file_id: {type: string, pattern: "^[0-9a-f]{32}$"}
      additionalProperties: false
    recovery_receipt:
      type: object
      required: [receipt_version, file_name, file_size_bytes, sha256, active_scene_changed]
      properties:
        receipt_version: {type: integer, const: 1}
        file_name:
          type: string
          minLength: 5
          maxLength: 255
          pattern: "^[^/\\\\]+\\.[vV][dD][fF]$"
        file_size_bytes: {type: integer, minimum: 1}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        active_scene_changed: {type: boolean, const: false}
      additionalProperties: false
    scene_receipt:
      type: object
      required:
        - active_scene_observed_via
        - file_evidence_observed_via
        - file_name
        - file_size_bytes
        - sha256
        - scene_identity_fields
        - scene_identity_sha256
      properties:
        active_scene_observed_via: {type: string, const: official_sdk}
        file_evidence_observed_via: {type: string, const: filesystem}
        file_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[^/\\\\]+$"
        file_size_bytes: {type: integer, minimum: 1}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        scene_identity_fields: {$ref: "#/$defs/scene_identity_fields"}
        scene_identity_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        target_identity: {$ref: "#/$defs/target_identity"}
      additionalProperties: false
    guarded_scene_receipt:
      allOf:
        - {$ref: "#/$defs/scene_receipt"}
        - type: object
          required: [target_identity]
    preflight_rejected_context:
      type: object
      required:
        - receipt_version
        - request_id
        - state
        - effect
        - replay_allowed
        - host_connection_performed
        - dispatch_performed
        - confirmation_consumed
        - failed_precondition
        - before_receipt
        - after_receipt
      properties:
        receipt_version: {type: string, const: "1.0"}
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        state: {type: string, const: preflight_rejected}
        effect: {type: string, const: unchanged}
        replay_allowed: {type: boolean, const: false}
        host_connection_performed: {type: boolean, const: false}
        dispatch_performed: {type: boolean, const: false}
        confirmation_consumed: {type: boolean, const: false}
        failed_precondition:
          type: string
          enum:
            - canonical_target_is_contained_by_canonical_trusted_root
            - target_is_regular_vdf_without_symlink_or_reparse_escape
            - target_basename_size_and_sha256_match_recovery_receipt
            - recovery_receipt_reports_active_scene_unchanged
            - operator_confirmation_is_fresh_exact_scope_and_unused
        before_receipt: {type: "null"}
        after_receipt: {type: "null"}
      additionalProperties: false
    confirmation_consume_rejected_context:
      type: object
      required:
        - receipt_version
        - request_id
        - state
        - effect
        - replay_allowed
        - host_connection_performed
        - before_receipt_captured
        - dispatch_performed
        - confirmation_consumed
        - consume_outcome
        - before_receipt
        - after_receipt
      properties:
        receipt_version: {type: string, const: "1.0"}
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        state: {type: string, const: confirmation_consume_rejected}
        effect: {type: string, const: unknown}
        replay_allowed: {type: boolean, const: false}
        host_connection_performed: {type: boolean, const: true}
        before_receipt_captured: {type: boolean, const: true}
        dispatch_performed: {type: boolean, const: false}
        confirmation_consumed: {type: boolean, const: false}
        consume_outcome: {type: string, const: lost_atomic_compare_and_set}
        before_receipt: {$ref: "#/$defs/scene_receipt"}
        after_receipt: {type: "null"}
      additionalProperties: false
    target_guard_rejected_context:
      type: object
      required:
        - receipt_version
        - request_id
        - state
        - effect
        - replay_allowed
        - host_connection_performed
        - before_receipt_captured
        - dispatch_performed
        - confirmation_consumed
        - guard_outcome
        - before_receipt
        - after_receipt
      properties:
        receipt_version: {type: string, const: "1.0"}
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        state: {type: string, const: target_guard_rejected}
        effect: {type: string, const: unknown}
        replay_allowed: {type: boolean, const: false}
        host_connection_performed: {type: boolean, const: true}
        before_receipt_captured: {type: boolean, const: true}
        dispatch_performed: {type: boolean, const: false}
        confirmation_consumed: {type: boolean, const: false}
        guard_outcome: {type: string, const: predispatch_identity_or_receipt_mismatch}
        before_receipt: {$ref: "#/$defs/scene_receipt"}
        after_receipt: {type: "null"}
      additionalProperties: false
    dispatched_context:
      type: object
      required:
        - receipt_version
        - request_id
        - state
        - replay_allowed
        - dispatch_performed
        - confirmation_consumed
        - approved_recovery_receipt
        - effect
        - readback_performed
        - before_receipt
        - after_receipt
      properties:
        receipt_version: {type: string, const: "1.0"}
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        state:
          type: string
          enum: [succeeded, failed_unchanged, failed_unknown, timed_out, indeterminate]
        replay_allowed: {type: boolean, const: false}
        dispatch_performed: {type: boolean, const: true}
        confirmation_consumed: {type: boolean, const: true}
        approved_recovery_receipt: {$ref: "#/$defs/recovery_receipt"}
        effect: {type: string, enum: [verified, unchanged, unknown]}
        readback_performed: {type: boolean}
        before_receipt: {$ref: "#/$defs/scene_receipt"}
        after_receipt:
          oneOf:
            - {$ref: "#/$defs/scene_receipt"}
            - {type: "null"}
    succeeded_context:
      allOf:
        - {$ref: "#/$defs/dispatched_context"}
        - type: object
          required: [approved_target_identity, postcondition_evidence]
          properties:
            state: {type: string, const: succeeded}
            effect: {type: string, const: verified}
            readback_performed: {type: boolean, const: true}
            approved_target_identity: {$ref: "#/$defs/target_identity"}
            postcondition_evidence:
              type: object
              required:
                - active_scene_readback_performed
                - before_after_distinct
                - after_matches_approved_recovery_receipt
                - after_matches_guarded_confirmation_identity
              properties:
                active_scene_readback_performed: {type: boolean, const: true}
                before_after_distinct: {type: boolean, const: true}
                after_matches_approved_recovery_receipt: {type: boolean, const: true}
                after_matches_guarded_confirmation_identity: {type: boolean, const: true}
              additionalProperties: false
            after_receipt: {$ref: "#/$defs/guarded_scene_receipt"}
      unevaluatedProperties: false
    failed_unchanged_context:
      allOf:
        - {$ref: "#/$defs/dispatched_context"}
        - type: object
          required: [postcondition_evidence]
          properties:
            state: {type: string, const: failed_unchanged}
            effect: {type: string, const: unchanged}
            readback_performed: {type: boolean, const: true}
            postcondition_evidence:
              type: object
              required: [active_scene_readback_performed, before_after_equal]
              properties:
                active_scene_readback_performed: {type: boolean, const: true}
                before_after_equal: {type: boolean, const: true}
              additionalProperties: false
            after_receipt: {$ref: "#/$defs/scene_receipt"}
      unevaluatedProperties: false
    failed_unknown_context:
      allOf:
        - {$ref: "#/$defs/dispatched_context"}
        - type: object
          properties:
            state: {type: string, const: failed_unknown}
            effect: {type: string, const: unknown}
            readback_performed: {type: boolean, const: false}
            after_receipt: {type: "null"}
      unevaluatedProperties: false
    unknown_effect_context:
      allOf:
        - {$ref: "#/$defs/dispatched_context"}
        - type: object
          properties:
            state: {type: string, enum: [timed_out, indeterminate]}
            effect: {type: string, const: unknown}
            readback_performed: {type: boolean, const: false}
            after_receipt: {type: "null"}
      unevaluatedProperties: false
  oneOf:
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
        prompt: {type: [string, "null"]}
        error: {type: string, const: RestorePreflightRejected}
        context: {$ref: "#/$defs/preflight_rejected_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
        prompt: {type: [string, "null"]}
        error: {type: string, const: RestoreConfirmationConsumeRejected}
        context: {$ref: "#/$defs/confirmation_consume_rejected_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
        prompt: {type: [string, "null"]}
        error: {type: string, const: RestoreTargetGuardRejected}
        context: {$ref: "#/$defs/target_guard_rejected_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        prompt: {type: [string, "null"]}
        error: {type: "null"}
        context: {$ref: "#/$defs/succeeded_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
        prompt: {type: [string, "null"]}
        error: {type: string, const: RestoreFailedUnchanged}
        context: {$ref: "#/$defs/failed_unchanged_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
        prompt: {type: [string, "null"]}
        error: {type: string, const: RestoreFailedUnknown}
        context: {$ref: "#/$defs/failed_unknown_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
        prompt: {type: [string, "null"]}
        error: {type: string, const: RestoreTimedOut}
        context:
          allOf:
            - {$ref: "#/$defs/unknown_effect_context"}
            - properties:
                state: {type: string, const: timed_out}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
        prompt: {type: [string, "null"]}
        error: {type: string, const: RestoreIndeterminate}
        context:
          allOf:
            - {$ref: "#/$defs/unknown_effect_context"}
            - properties:
                state: {type: string, const: indeterminate}
      additionalProperties: false

result_validation_pipeline: [draft2020_schema, semantic_postconditions, scene_identity_digest]

scene_receipt_validation:
  apply_to: [before_receipt, after_receipt]
  canonicalization: official-sdk-scene-identity-json-v1
  fields_member: scene_identity_fields
  digest_member: scene_identity_sha256
  field_relations: [scene_identity_fields.scene_name_equals_file_name]
  mismatch: reject_terminal_result

semantic_postconditions:
  preflight_rejected: {}
  confirmation_consume_rejected: {}
  target_guard_rejected: {}
  succeeded:
    equal:
      - [/context/after_receipt/file_name, /context/approved_recovery_receipt/file_name]
      - [/context/after_receipt/file_size_bytes, /context/approved_recovery_receipt/file_size_bytes]
      - [/context/after_receipt/sha256, /context/approved_recovery_receipt/sha256]
      - [/context/after_receipt/target_identity/canonical_path_sha256, /context/approved_target_identity/canonical_path_sha256]
      - [/context/after_receipt/target_identity/volume_serial, /context/approved_target_identity/volume_serial]
      - [/context/after_receipt/target_identity/file_id, /context/approved_target_identity/file_id]
      - [/context/after_receipt/scene_identity_fields/canonical_path_sha256, /context/approved_target_identity/canonical_path_sha256]
    not_equal:
      - [/context/before_receipt/scene_identity_sha256, /context/after_receipt/scene_identity_sha256]
  failed_unchanged:
    equal:
      - [/context/before_receipt/file_name, /context/after_receipt/file_name]
      - [/context/before_receipt/file_size_bytes, /context/after_receipt/file_size_bytes]
      - [/context/before_receipt/sha256, /context/after_receipt/sha256]
      - [/context/before_receipt/scene_identity_sha256, /context/after_receipt/scene_identity_sha256]
  failed_unknown: {}
  timed_out: {}
  indeterminate: {}
