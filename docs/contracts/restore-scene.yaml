      required:
        - receipt_version
        - request_id
        - state
        - effect
        - replay_allowed
        - host_connection_performed
        - before_receipt_captured
        - dispatch_performed
        - confirmation_consumed
        - consume_outcome
        - before_receipt
        - after_receipt
        - job
      properties:
        receipt_version: {type: string, const: "1.0"}
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        state: {type: string, const: confirmation_consume_rejected}
        effect: {type: string, const: unknown}
        replay_allowed: {type: boolean, const: false}
        host_connection_performed: {type: boolean, const: true}
        before_receipt_captured: {type: boolean, const: true}
        dispatch_performed: {type: boolean, const: false}
        confirmation_consumed: {type: boolean, const: false}
        consume_outcome: {type: string, const: lost_atomic_compare_and_set}
        before_receipt: {$ref: "#/$defs/scene_receipt"}
        after_receipt: {type: "null"}
        job: {$ref: "#/$defs/undispatched_job_descriptor"}
      additionalProperties: false
    target_guard_rejected_context:
      type: object
      required:
        - receipt_version
        - request_id
        - state
        - effect
        - replay_allowed
        - host_connection_performed
        - before_receipt_captured
        - dispatch_performed
        - confirmation_consumed
        - guard_outcome
        - before_receipt
        - after_receipt
        - job
      properties:
        receipt_version: {type: string, const: "1.0"}
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        state: {type: string, const: target_guard_rejected}
        effect: {type: string, const: unknown}
        replay_allowed: {type: boolean, const: false}
        host_connection_performed: {type: boolean, const: true}
        before_receipt_captured: {type: boolean, const: true}
        dispatch_performed: {type: boolean, const: false}
        confirmation_consumed: {type: boolean, const: false}
        guard_outcome: {type: string, const: predispatch_identity_or_receipt_mismatch}
        before_receipt: {$ref: "#/$defs/scene_receipt"}
        after_receipt: {type: "null"}
        job: {$ref: "#/$defs/undispatched_job_descriptor"}
      additionalProperties: false
    dispatched_context:
      type: object
      required:
        - receipt_version
        - request_id
        - state
        - replay_allowed
        - dispatch_performed
        - confirmation_consumed
        - approved_recovery_receipt
        - effect
        - readback_performed
        - before_receipt
        - after_receipt
        - job
      properties:
        receipt_version: {type: string, const: "1.0"}
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        state:
          type: string
          enum: [succeeded, failed_unchanged, failed_unknown, timed_out, indeterminate]
        replay_allowed: {type: boolean, const: false}
        dispatch_performed: {type: boolean, const: true}
        confirmation_consumed: {type: boolean, const: true}
        approved_recovery_receipt: {$ref: "#/$defs/recovery_receipt"}
        effect: {type: string, enum: [verified, unchanged, unknown]}
        readback_performed: {type: boolean}
        before_receipt: {$ref: "#/$defs/scene_receipt"}
        after_receipt:
          oneOf:
            - {$ref: "#/$defs/scene_receipt"}
            - {type: "null"}
        job: {$ref: "#/$defs/job_descriptor"}
    succeeded_context:
      allOf:
        - {$ref: "#/$defs/dispatched_context"}
        - type: object
          required: [approved_target_identity, postcondition_evidence]
          properties:
            state: {type: string, const: succeeded}
            effect: {type: string, const: verified}
            readback_performed: {type: boolean, const: true}
            approved_target_identity: {$ref: "#/$defs/target_identity"}
            postcondition_evidence:
              type: object
              required:
                - active_scene_readback_performed
                - before_after_distinct
                - after_matches_approved_recovery_receipt
                - after_matches_guarded_confirmation_identity
              properties:
                active_scene_readback_performed: {type: boolean, const: true}
                before_after_distinct: {type: boolean, const: true}
                after_matches_approved_recovery_receipt: {type: boolean, const: true}
                after_matches_guarded_confirmation_identity: {type: boolean, const: true}
              additionalProperties: false
            after_receipt: {$ref: "#/$defs/guarded_scene_receipt"}
            job: {$ref: "#/$defs/terminal_readback_job_descriptor"}
      unevaluatedProperties: false
    failed_unchanged_context:
      allOf:
        - {$ref: "#/$defs/dispatched_context"}
        - type: object
          required: [postcondition_evidence]
          properties:
            state: {type: string, const: failed_unchanged}
            effect: {type: string, const: unchanged}
            readback_performed: {type: boolean, const: true}
            postcondition_evidence:
              type: object
              required: [active_scene_readback_performed, before_after_equal]
              properties:
                active_scene_readback_performed: {type: boolean, const: true}
                before_after_equal: {type: boolean, const: true}
              additionalProperties: false
            after_receipt: {$ref: "#/$defs/scene_receipt"}
            job: {$ref: "#/$defs/terminal_readback_job_descriptor"}
      unevaluatedProperties: false
    failed_unknown_context:
      allOf:
        - {$ref: "#/$defs/dispatched_context"}
        - type: object
          properties:
            state: {type: string, const: failed_unknown}
            effect: {type: string, const: unknown}
            readback_performed: {type: boolean, const: false}
            after_receipt: {type: "null"}
            job: {$ref: "#/$defs/terminal_unknown_job_descriptor"}
      unevaluatedProperties: false
    unknown_effect_context:
      allOf:
        - {$ref: "#/$defs/dispatched_context"}
        - type: object
          properties:
            state: {type: string, enum: [timed_out, indeterminate]}
            effect: {type: string, const: unknown}
            readback_performed: {type: boolean, const: false}
            after_receipt: {type: "null"}
            job: {$ref: "#/$defs/pending_job_descriptor"}
      unevaluatedProperties: false
  oneOf:
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string, const: Recovery scene restore rejected before host connection.}
        prompt: {type: "null"}
        error: {type: string, const: RestorePreflightRejected}
        context: {$ref: "#/$defs/preflight_rejected_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string, const: Confirmation was consumed by a concurrent request before dispatch.}
        prompt: {type: "null"}
        error: {type: string, const: RestoreConfirmationConsumeRejected}
        context: {$ref: "#/$defs/confirmation_consume_rejected_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string, const: Guarded target identity could not be reconfirmed before dispatch.}
        prompt: {type: "null"}
        error: {type: string, const: RestoreTargetGuardRejected}
        context: {$ref: "#/$defs/target_guard_rejected_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: true}
        message: {type: string, const: Recovery scene restore verified.}
        prompt: {type: "null"}
        error: {type: "null"}
        context: {$ref: "#/$defs/succeeded_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string, const: Recovery scene restore failed without changing the active scene.}
        prompt: {type: "null"}
        error: {type: string, const: RestoreFailedUnchanged}
        context: {$ref: "#/$defs/failed_unchanged_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string, const: Recovery scene restore did not reach verified success.}
        prompt: {type: "null"}
        error: {type: string, const: RestoreFailedUnknown}
        context: {$ref: "#/$defs/failed_unknown_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string, const: Recovery scene restore did not reach verified success.}
        prompt: {type: "null"}
        error: {type: string, const: RestoreTimedOut}
        context:
          allOf:
            - {$ref: "#/$defs/unknown_effect_context"}
            - properties:
                state: {type: string, const: timed_out}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: false}
        message: {type: string, const: Recovery scene restore did not reach verified success.}
        prompt: {type: "null"}
        error: {type: string, const: RestoreIndeterminate}
        context:
          allOf:
            - {$ref: "#/$defs/unknown_effect_context"}
            - properties:
                state: {type: string, const: indeterminate}
      additionalProperties: false

output_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://github.com/dcc-mcp/dcc-mcp-shogun/docs/contracts/restore-scene-public-output.schema.json
  title: Proposed public-safe recovery-scene restore result
  $defs:
    public_audit_projection:
      type: object
      required: [projection_version, observation_hmac_sha256]
      properties:
        projection_version: {type: string, const: "1.0"}
        observation_hmac_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      additionalProperties: false
    public_job_descriptor:
      type: object
      required:
        - job_id
        - request_correlation_hmac_sha256
        - job_generation_hmac_sha256
        - operation
        - operation_binding_hmac_sha256
        - owner
        - status_tool
        - status
        - snapshot_source
        - terminal_source
        - cancellation_disposition
        - handle_retention_owner
        - dispatch_count
        - dispatch_attempt_reserved
        - poll_allowed
        - duplicate_execution_allowed
        - late_completion_disposition
        - cleanup_disposition
        - record_revision
        - event_sequence
        - identity_tombstoned
        - cancellation_requested
        - cancellation_effective
        - terminal_event_hmac_sha256
      properties:
        job_id: {type: string, pattern: "^rj1-[0-9a-f]{64}$"}
        request_correlation_hmac_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        job_generation_hmac_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        operation: {type: string, const: restore_scene}
        operation_binding_hmac_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        owner: {type: string, const: trusted_adapter_local_restore_job_registry}
        status_tool: {type: string, const: jobs_get_status}
        status:
          type: string
          enum: [terminal_not_dispatched, dispatch_uncertain, awaiting_late_readback, terminal]
        snapshot_source:
          type: string
          enum:
            - preflight
            - confirmation_cas
            - target_guard
            - official_sdk_readback
            - official_sdk_failure
            - request_timeout
            - transport_loss
            - cancellation_before_dispatch
            - cancellation_after_dispatch
            - durable_dispatch_reservation
            - late_official_sdk_readback
        terminal_source:
          type: [string, "null"]
          enum:
            - preflight
            - confirmation_cas
            - target_guard
            - official_sdk_readback
            - official_sdk_failure
            - cancellation_before_dispatch
            - null
        cancellation_disposition:
          type: string
          enum:
            - not_requested
            - honored_before_dispatch
            - requested_after_dispatch_operation_continues
        handle_retention_owner:
          type: string
          enum:
            - released_before_dispatch
            - trusted_adapter_local_restore_job_registry
            - cleanup_ownership_indeterminate_registry_quarantine
            - released_after_terminal_readback
            - released_after_terminal_unknown
        dispatch_count: {type: integer, minimum: 0, maximum: 1}
        dispatch_attempt_reserved: {type: boolean}
        poll_allowed: {type: boolean}
        duplicate_execution_allowed: {type: boolean, const: false}
        late_completion_disposition:
          type: string
          enum:
            - not_applicable
            - poll_exact_job_without_redispatch
            - terminalized_by_official_sdk_readback
        cleanup_disposition:
          type: string
          enum:
            - not_started
            - released
            - release_failed_owner_retained
            - released_after_error_verified_closed
            - release_indeterminate_quarantined
        record_revision: {type: integer, minimum: 1}
        event_sequence: {type: integer, minimum: 0}
        identity_tombstoned: {type: boolean, const: true}
        cancellation_requested: {type: boolean}
        cancellation_effective: {type: boolean}
        terminal_event_hmac_sha256:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
      additionalProperties: false
    public_undispatched_job:
      allOf:
        - {$ref: "#/$defs/public_job_descriptor"}
        - type: object
          properties:
            status: {type: string, const: terminal_not_dispatched}
            snapshot_source:
              type: string
              enum: [preflight, confirmation_cas, target_guard, cancellation_before_dispatch]
            terminal_source:
              type: string
              enum: [preflight, confirmation_cas, target_guard, cancellation_before_dispatch]
            cancellation_disposition:
              type: string
              enum: [not_requested, honored_before_dispatch]
            cancellation_requested: {type: boolean}
            cancellation_effective: {type: boolean}
            handle_retention_owner:
              type: string
              enum:
                - released_before_dispatch
                - trusted_adapter_local_restore_job_registry
                - cleanup_ownership_indeterminate_registry_quarantine
            dispatch_count: {type: integer, const: 0}
            dispatch_attempt_reserved: {type: boolean, const: false}
            poll_allowed: {type: boolean, const: false}
            late_completion_disposition: {type: string, const: not_applicable}
            cleanup_disposition:
              type: string
              enum:
                - released
                - release_failed_owner_retained
                - released_after_error_verified_closed
                - release_indeterminate_quarantined
            terminal_event_hmac_sha256: {type: string}
        - oneOf:
            - properties:
                cancellation_disposition: {const: not_requested}
                cancellation_requested: {const: false}
                cancellation_effective: {const: false}
            - properties:
                cancellation_disposition: {const: honored_before_dispatch}
                cancellation_requested: {const: true}
                cancellation_effective: {const: true}
        - oneOf:
            - properties:
                cleanup_disposition: {const: release_failed_owner_retained}
                handle_retention_owner:
                  {const: trusted_adapter_local_restore_job_registry}
            - properties:
                cleanup_disposition: {const: release_indeterminate_quarantined}
                handle_retention_owner:
                  {const: cleanup_ownership_indeterminate_registry_quarantine}
            - properties:
                cleanup_disposition:
                  {enum: [released, released_after_error_verified_closed]}
                handle_retention_owner: {const: released_before_dispatch}
    public_dispatch_uncertain_job:
      allOf:
        - {$ref: "#/$defs/public_job_descriptor"}
        - type: object
          properties:
            status: {type: string, const: dispatch_uncertain}
            snapshot_source:
              type: string
              enum: [durable_dispatch_reservation, cancellation_after_dispatch]
            terminal_source: {type: "null"}
            cancellation_disposition:
              type: string
              enum: [not_requested, requested_after_dispatch_operation_continues]
            cancellation_requested: {type: boolean}
            cancellation_effective: {type: boolean, const: false}
            handle_retention_owner:
              type: string
              const: trusted_adapter_local_restore_job_registry
            dispatch_count: {type: integer, const: 0}
            dispatch_attempt_reserved: {type: boolean, const: true}
            poll_allowed: {type: boolean, const: true}
            late_completion_disposition:
              type: string
              const: poll_exact_job_without_redispatch
            cleanup_disposition: {type: string, const: not_started}
            terminal_event_hmac_sha256: {type: "null"}
        - oneOf:
            - properties:
                cancellation_disposition: {const: not_requested}
                cancellation_requested: {const: false}
                cancellation_effective: {const: false}
            - properties:
                cancellation_disposition: {const: requested_after_dispatch_operation_continues}
                cancellation_requested: {const: true}
                cancellation_effective: {const: false}
    public_pending_job:
      allOf:
        - {$ref: "#/$defs/public_job_descriptor"}
        - type: object
          properties:
            status: {type: string, const: awaiting_late_readback}
            snapshot_source:
              type: string
              enum: [request_timeout, transport_loss, cancellation_after_dispatch]
            terminal_source: {type: "null"}
            cancellation_disposition:
              type: string
              enum: [not_requested, requested_after_dispatch_operation_continues]
            cancellation_requested: {type: boolean}
            cancellation_effective: {type: boolean, const: false}
            handle_retention_owner:
              type: string
              const: trusted_adapter_local_restore_job_registry
            dispatch_count: {type: integer, const: 1}
            dispatch_attempt_reserved: {type: boolean, const: true}
            poll_allowed: {type: boolean, const: true}
            late_completion_disposition:
              type: string
              const: poll_exact_job_without_redispatch
            cleanup_disposition: {type: string, const: not_started}
            terminal_event_hmac_sha256: {type: "null"}
        - oneOf:
            - properties:
                cancellation_disposition: {const: not_requested}
                cancellation_requested: {const: false}
                cancellation_effective: {const: false}
            - properties:
                cancellation_disposition: {const: requested_after_dispatch_operation_continues}
                cancellation_requested: {const: true}
                cancellation_effective: {const: false}
    public_terminal_readback_job:
      allOf:
        - {$ref: "#/$defs/public_job_descriptor"}
        - type: object
          properties:
            status: {type: string, const: terminal}
            snapshot_source:
              type: string
              enum: [official_sdk_readback, late_official_sdk_readback]
            terminal_source: {type: string, const: official_sdk_readback}
            cancellation_requested: {type: boolean}
            cancellation_effective: {type: boolean, const: false}
            handle_retention_owner:
              type: string
              enum:
                - released_after_terminal_readback
                - trusted_adapter_local_restore_job_registry
                - cleanup_ownership_indeterminate_registry_quarantine
            dispatch_count: {type: integer, const: 1}
            dispatch_attempt_reserved: {type: boolean, const: true}
            poll_allowed: {type: boolean, const: false}
            late_completion_disposition:
              type: string
              enum: [not_applicable, terminalized_by_official_sdk_readback]
            cleanup_disposition:
              type: string
              enum:
                - released
                - release_failed_owner_retained
                - released_after_error_verified_closed
                - release_indeterminate_quarantined
            terminal_event_hmac_sha256: {type: string}
        - oneOf:
            - properties:
                cancellation_disposition: {const: not_requested}
                cancellation_requested: {const: false}
                cancellation_effective: {const: false}
            - properties:
                cancellation_disposition: {const: requested_after_dispatch_operation_continues}
                cancellation_requested: {const: true}
                cancellation_effective: {const: false}
        - oneOf:
            - properties:
                cleanup_disposition: {const: release_failed_owner_retained}
                handle_retention_owner:
                  {const: trusted_adapter_local_restore_job_registry}
            - properties:
                cleanup_disposition: {const: release_indeterminate_quarantined}
                handle_retention_owner:
                  {const: cleanup_ownership_indeterminate_registry_quarantine}
            - properties:
                cleanup_disposition:
                  {enum: [released, released_after_error_verified_closed]}
                handle_retention_owner: {const: released_after_terminal_readback}
    public_terminal_unknown_job:
      allOf:
        - {$ref: "#/$defs/public_job_descriptor"}
        - type: object
          properties:
            status: {type: string, const: terminal}
            snapshot_source: {type: string, const: official_sdk_failure}
            terminal_source: {type: string, const: official_sdk_failure}
            cancellation_requested: {type: boolean}
            cancellation_effective: {type: boolean, const: false}
            handle_retention_owner:
              type: string
              enum:
                - released_after_terminal_unknown
                - trusted_adapter_local_restore_job_registry
                - cleanup_ownership_indeterminate_registry_quarantine
            dispatch_count: {type: integer, const: 1}
            dispatch_attempt_reserved: {type: boolean, const: true}
            poll_allowed: {type: boolean, const: false}
            late_completion_disposition: {type: string, const: not_applicable}
            cleanup_disposition:
              type: string
              enum:
                - released
                - release_failed_owner_retained
                - released_after_error_verified_closed
                - release_indeterminate_quarantined
            terminal_event_hmac_sha256: {type: string}
        - oneOf:
            - properties:
                cancellation_disposition: {const: not_requested}
                cancellation_requested: {const: false}
                cancellation_effective: {const: false}
            - properties:
                cancellation_disposition: {const: requested_after_dispatch_operation_continues}
                cancellation_requested: {const: true}
                cancellation_effective: {const: false}
        - oneOf:
            - properties:
                cleanup_disposition: {const: release_failed_owner_retained}
                handle_retention_owner:
                  {const: trusted_adapter_local_restore_job_registry}
            - properties:
                cleanup_disposition: {const: release_indeterminate_quarantined}
                handle_retention_owner:
                  {const: cleanup_ownership_indeterminate_registry_quarantine}
            - properties:
                cleanup_disposition:
                  {enum: [released, released_after_error_verified_closed]}
                handle_retention_owner: {const: released_after_terminal_unknown}
    public_context:
      type: object
      required:
        - receipt_version
        - request_correlation_hmac_sha256
        - state
        - effect
        - replay_allowed
        - host_connection_performed
        - before_receipt_captured
        - dispatch_performed
        - confirmation_consumed
        - readback_performed
        - approved_recovery_receipt_hmac_sha256
        - approved_target_identity_hmac_sha256
        - before_receipt
        - after_receipt
        - postcondition_status
        - failure_stage
        - job
      properties:
        receipt_version: {type: string, const: "1.0"}
        request_correlation_hmac_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        state:
          type: string
          enum:
            - preflight_rejected
            - confirmation_consume_rejected
            - target_guard_rejected
            - succeeded
            - failed_unchanged
            - failed_unknown
            - timed_out
            - indeterminate
        effect: {type: string, enum: [verified, unchanged, unknown]}
        replay_allowed: {type: boolean, const: false}
        host_connection_performed: {type: boolean}
        before_receipt_captured: {type: boolean}
        dispatch_performed: {type: boolean}
        confirmation_consumed: {type: boolean}
        readback_performed: {type: boolean}
        approved_recovery_receipt_hmac_sha256:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        approved_target_identity_hmac_sha256:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        before_receipt:
          oneOf:
            - {$ref: "#/$defs/public_audit_projection"}
            - {type: "null"}
        after_receipt:
          oneOf:
            - {$ref: "#/$defs/public_audit_projection"}
            - {type: "null"}
        postcondition_status:
          type: string
          enum: [not_evaluated, verified, unchanged, unknown]
        failure_stage:
          type: [string, "null"]
          enum:
            - preflight
            - confirmation_cas
            - target_guard
            - official_sdk_failure
            - request_timeout
            - transport_loss
            - cancellation_after_dispatch
            - null
        job: {$ref: "#/$defs/public_job_descriptor"}
      additionalProperties: false
    public_preflight_context:
      allOf:
        - {$ref: "#/$defs/public_context"}
        - properties:
            state: {const: preflight_rejected}
            effect: {const: unchanged}
            host_connection_performed: {const: false}
            before_receipt_captured: {const: false}
            dispatch_performed: {const: false}
            confirmation_consumed: {const: false}
            readback_performed: {const: false}
