target_guard:
  strategy: pin_full_windows_namespace_chain_through_dispatch
  open_api: CreateFileW
  dispatch_path_api: GetFinalPathNameByHandleW_VOLUME_NAME_GUID
  directory_desired_access: [FILE_READ_ATTRIBUTES]
  directory_flags: [FILE_FLAG_BACKUP_SEMANTICS, FILE_FLAG_OPEN_REPARSE_POINT]
  target_desired_access: [GENERIC_READ, FILE_READ_ATTRIBUTES]
  target_flags: [FILE_FLAG_OPEN_REPARSE_POINT]
  share_mode: [FILE_SHARE_READ]
  creation_disposition: OPEN_EXISTING
  pinned_objects:
    - volume_root
    - every_directory_component_including_trusted_root
    - target_file
  deny_conflicting_access: [write, delete, rename, replace]
  identity_fields: [canonical_path_sha256, volume_serial, file_id]
  component_identity_fields: [volume_guid_final_path, volume_serial, file_id, reparse_tag]
  namespace_validation:
    - handle_derived_component_chain_is_contiguous
    - handle_derived_target_is_within_handle_derived_trusted_root
    - reject_every_reparse_component_and_target
    - reject_alternate_data_streams_before_and_after_open
    - target_link_count_equals_one
  dispatch_path: volume_guid_final_path_derived_from_pinned_target
  sdk_dispatch: adapter_requires_retained_chain_not_bare_path
  per_use_recapture: immediately_before_and_after_each_sdk_path_open
  hold_from: before_first_namespace_identity_capture
  hold_until: terminal_official_sdk_readback_or_unknown_effect
  validation_checkpoints:
    - after_official_sdk_before_receipt_capture_completed
    - after_all_pinned_handle_and_target_receipt_recapture
    - immediately_before_confirmation_cas
    - dispatch_entry_before_confirmation_cas_with_full_chain_still_held
  predispatch_recapture: all_pinned_handle_identities_and_target_receipt_immediately_before_confirmation_cas
  change_before_cas: target_guard_rejected_without_consume_or_dispatch
  swap_attempt_while_pinned: blocked_by_windows_share_contract
  close_semantics:
    close_api: CloseHandle
    false_return: independently_probe_only_for_verified_closed
    observations: [closed, indeterminate]
    closed: remove_numeric_handle_and_never_retry
    valid_numeric_after_false: indeterminate_due_to_unprovable_handle_generation
    same_file_same_numeric_reuse: cannot_prove_original_ownership
    indeterminate: quarantine_without_retry_or_release_claim
    retry_after_false_return: forbidden
    primary_outcome: preserved
  adversarial_proof:
    phases: [preflight, recapture, cas, dispatch]
    swap_kinds: [namespace, junction, parent, same_content]
    predispatch_change_invariant: consume_count_equals_dispatch_count_equals_zero
  windows_integration_proof:
    platform: windows_ci_real_filesystem
    sdk_boundary: CreateFileW_reopens_volume_guid_path
    retained_through_open: volume_root_every_directory_and_target_handles
    identity_assertion: full_handle_chain_and_reopened_target_equal_confirmation
    attack_kinds:
      - target
      - parent
      - junction
      - namespace
      - same_content
      - preexisting_file_symlink
      - preexisting_junction
      - alternate_data_stream
      - cross_root_hardlink
    attack_outcome_while_retained: preexisting_aliases_rejected_runtime_swaps_blocked_confirmed_identity_loaded
    control_after_release: same_swap_succeeds_and_path_identity_changes
    real_shogun_invoked: false
  readback_match: official_sdk_active_scene_to_guarded_confirmation_identity

input_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://github.com/dcc-mcp/dcc-mcp-shogun/docs/contracts/restore-scene-input.schema.json
  title: Proposed recovery-scene restore request
  type: object
  required: [request_id, trusted_root, file_path, recovery_receipt, operator_confirmation]
  properties:
    request_id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
    trusted_root:
      type: string
      minLength: 3
      maxLength: 4096
      pattern: "^[A-Za-z]:[\\\\/][^:]+"
    file_path:
      type: string
      minLength: 7
      maxLength: 4096
      pattern: "^[A-Za-z]:[\\\\/][^:]+\\.[vV][dD][fF]$"
    recovery_receipt: {$ref: "#/$defs/recovery_receipt"}
    operator_confirmation:
      type: object
      required: [confirmation_id]
      properties:
        confirmation_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
      additionalProperties: false
  additionalProperties: false
  $defs:
    recovery_receipt:
      type: object
      required: [receipt_version, file_name, file_size_bytes, sha256, active_scene_changed]
      properties:
        receipt_version: {type: integer, const: 1}
        file_name:
          type: string
          minLength: 5
          maxLength: 255
          pattern: "^[^/\\\\]+\\.[vV][dD][fF]$"
        file_size_bytes: {type: integer, minimum: 1, maximum: 8589934592}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        active_scene_changed: {type: boolean, const: false}
      additionalProperties: false

private_audit_result_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://github.com/dcc-mcp/dcc-mcp-shogun/docs/contracts/restore-scene-output.schema.json
  title: Proposed recovery-scene restore terminal result
  $defs:
    scene_identity_fields:
      type: object
      required: [canonical_path_sha256, frame_count, scene_name]
      properties:
        canonical_path_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        frame_count: {type: integer, minimum: 0}
        scene_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[^/\\\\]+$"
      additionalProperties: false
    target_identity:
      type: object
      required: [canonical_path_sha256, volume_serial, file_id]
      properties:
        canonical_path_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        volume_serial: {type: string, pattern: "^[0-9A-F]{16}$"}
        file_id: {type: string, pattern: "^[0-9a-f]{32}$"}
      additionalProperties: false
    recovery_receipt:
      type: object
      required: [receipt_version, file_name, file_size_bytes, sha256, active_scene_changed]
      properties:
        receipt_version: {type: integer, const: 1}
        file_name:
          type: string
          minLength: 5
          maxLength: 255
          pattern: "^[^/\\\\]+\\.[vV][dD][fF]$"
        file_size_bytes: {type: integer, minimum: 1, maximum: 8589934592}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        active_scene_changed: {type: boolean, const: false}
      additionalProperties: false
    scene_receipt:
      type: object
      required:
        - active_scene_observed_via
        - file_evidence_observed_via
        - file_name
        - file_size_bytes
        - sha256
        - scene_identity_fields
        - scene_identity_sha256
      properties:
        active_scene_observed_via: {type: string, const: official_sdk}
        file_evidence_observed_via: {type: string, const: filesystem}
        file_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[^/\\\\]+$"
        file_size_bytes: {type: integer, minimum: 1, maximum: 8589934592}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        scene_identity_fields: {$ref: "#/$defs/scene_identity_fields"}
        scene_identity_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        target_identity: {$ref: "#/$defs/target_identity"}
      additionalProperties: false
    guarded_scene_receipt:
      allOf:
        - {$ref: "#/$defs/scene_receipt"}
        - type: object
          required: [target_identity]
    job_descriptor:
      type: object
      required:
        - job_id
        - job_generation
        - request_id
        - operation
        - operation_binding_sha256
        - owner
        - status_tool
        - status
        - snapshot_source
        - terminal_source
        - cancellation_disposition
        - handle_retention_owner
        - dispatch_count
        - dispatch_attempt_reserved
        - poll_allowed
        - duplicate_execution_allowed
        - late_completion_disposition
        - cleanup_disposition
        - record_revision
        - event_sequence
        - identity_tombstoned
        - cancellation_requested
        - cancellation_effective
        - terminal_event_id
        - terminal_event_digest_sha256
      properties:
