            before_receipt_captured: {const: true}
            dispatch_performed: {const: true}
            confirmation_consumed: {const: true}
            readback_performed: {const: true}
            approved_recovery_receipt_hmac_sha256: {type: string}
            approved_target_identity_hmac_sha256: {type: string}
            before_receipt: {$ref: "#/$defs/public_audit_projection"}
            after_receipt: {$ref: "#/$defs/public_audit_projection"}
