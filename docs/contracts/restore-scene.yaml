            approved_recovery_receipt_hmac_sha256: {type: "null"}
            approved_target_identity_hmac_sha256: {type: "null"}
            before_receipt: {$ref: "#/$defs/public_audit_projection"}
            after_receipt: {type: "null"}
            postcondition_status: {const: unknown}
