  scene_identity:
    version: official-sdk-scene-identity-json-v1
    official_sdk_calls: [GetSceneName, GetFrameCount]
    get_scene_name_tuple_rule:
      shape: exactly_two_strings_scene_path_and_name_or_path
      scene_path: absolute_windows_directory_for_saved_scene
      full_path: name_or_path_parent_must_equal_scene_path
      basename: join_name_or_path_to_scene_path
      relative_path_with_separator: reject
      scene_name: unicode_nfc_basename_of_name_or_path
      unsaved_sentinel: ['.', '.vdf']
      malformed_or_unsaved: reject_before_receipt
    field_sources:
      scene_name: GetSceneName[1].unicode_nfc_basename_after_exact_tuple_validation
      frame_count: GetFrameCount.strict_nonnegative_integer
      canonical_path_sha256: exact_derived_candidate_resolved_to_guarded_windows_final_path_identity
    members: [canonical_path_sha256, frame_count, scene_name]
    key_order: ascending_unicode_code_point
    encoding: utf-8
    ensure_ascii: false
