          type: string
          pattern: "^rj1-[0-9a-f]{64}$"
        job_generation: {type: string, pattern: "^[0-9a-f]{16}$"}
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        operation: {type: string, const: restore_scene}
        operation_binding_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        owner: {type: string, const: trusted_adapter_local_restore_job_registry}
        status_tool: {type: string, const: jobs_get_status}
        status:
          type: string
          enum: [terminal_not_dispatched, dispatch_uncertain, awaiting_late_readback, terminal]
        snapshot_source:
          type: string
          enum:
            - preflight
            - confirmation_cas
            - target_guard
            - official_sdk_readback
            - official_sdk_failure
            - request_timeout
            - transport_loss
            - cancellation_before_dispatch
            - cancellation_after_dispatch
            - durable_dispatch_reservation
            - late_official_sdk_readback
        terminal_source:
          type: [string, "null"]
          enum:
            - preflight
            - confirmation_cas
            - target_guard
            - official_sdk_readback
            - official_sdk_failure
            - cancellation_before_dispatch
            - null
        cancellation_disposition:
          type: string
          enum:
            - not_requested
            - honored_before_dispatch
            - requested_after_dispatch_operation_continues
        handle_retention_owner:
          type: string
          enum:
            - released_before_dispatch
