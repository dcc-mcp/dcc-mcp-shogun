              enum: [request_timeout, transport_loss, cancellation_after_dispatch]
            job: {$ref: "#/$defs/public_pending_job"}
  oneOf:
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {const: false}
        message: {const: Recovery scene restore rejected before host connection.}
        prompt: {type: "null"}
        error: {const: RestorePreflightRejected}
        context: {$ref: "#/$defs/public_preflight_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {const: false}
        message: {const: Confirmation was consumed by a concurrent request before dispatch.}
        prompt: {type: "null"}
        error: {const: RestoreConfirmationConsumeRejected}
        context: {$ref: "#/$defs/public_confirmation_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {const: false}
        message: {const: Guarded target identity could not be reconfirmed before dispatch.}
        prompt: {type: "null"}
        error: {const: RestoreTargetGuardRejected}
        context: {$ref: "#/$defs/public_guard_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {const: true}
        message: {const: Recovery scene restore verified.}
        prompt: {type: "null"}
        error: {type: "null"}
        context: {$ref: "#/$defs/public_succeeded_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {const: false}
        message: {const: Recovery scene restore failed without changing the active scene.}
        prompt: {type: "null"}
        error: {const: RestoreFailedUnchanged}
        context: {$ref: "#/$defs/public_unchanged_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {const: false}
        message: {const: Recovery scene restore did not reach verified success.}
        prompt: {type: "null"}
        error: {const: RestoreFailedUnknown}
        context: {$ref: "#/$defs/public_failed_unknown_context"}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {const: false}
        message: {const: Recovery scene restore did not reach verified success.}
        prompt: {type: "null"}
        error: {const: RestoreTimedOut}
        context:
          allOf:
            - {$ref: "#/$defs/public_pending_context"}
            - properties:
                state: {const: timed_out}
                failure_stage: {const: request_timeout}
      additionalProperties: false
    - type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {const: false}
        message: {const: Recovery scene restore did not reach verified success.}
        prompt: {type: "null"}
        error: {const: RestoreIndeterminate}
        context:
          allOf:
            - {$ref: "#/$defs/public_pending_context"}
            - properties:
                state: {const: indeterminate}
                failure_stage: {enum: [transport_loss, cancellation_after_dispatch]}
      additionalProperties: false

result_validation_pipeline:
  - draft2020_schema
  - latest_durable_job_revision
  - semantic_invariants
  - semantic_postconditions
  - scene_identity_digest

semantic_invariants:
  equal:
    - [/context/job/request_id, /context/request_id]
  latest_durable_job_revision:
    lookup: exact_private_job_id
    compare:
      - job_generation
      - operation_binding_sha256
      - record_revision
      - event_sequence
      - status
    mismatch: reject_stale_result_before_public_projection

scene_receipt_validation:
  apply_to: [before_receipt, after_receipt]
  canonicalization: official-sdk-scene-identity-json-v1
  fields_member: scene_identity_fields
  digest_member: scene_identity_sha256
  field_relations: [scene_identity_fields.scene_name_equals_file_name]
  mismatch: reject_terminal_result

semantic_postconditions:
  preflight_rejected: {}
  confirmation_consume_rejected: {}
  target_guard_rejected: {}
  succeeded:
    equal:
      - [/context/after_receipt/file_name, /context/approved_recovery_receipt/file_name]
      - [/context/after_receipt/file_size_bytes, /context/approved_recovery_receipt/file_size_bytes]
      - [/context/after_receipt/sha256, /context/approved_recovery_receipt/sha256]
      - [/context/after_receipt/target_identity/canonical_path_sha256, /context/approved_target_identity/canonical_path_sha256]
      - [/context/after_receipt/target_identity/volume_serial, /context/approved_target_identity/volume_serial]
      - [/context/after_receipt/target_identity/file_id, /context/approved_target_identity/file_id]
      - [/context/after_receipt/scene_identity_fields/canonical_path_sha256, /context/approved_target_identity/canonical_path_sha256]
    not_equal:
      - [/context/before_receipt/scene_identity_sha256, /context/after_receipt/scene_identity_sha256]
  failed_unchanged:
    equal:
      - [/context/before_receipt/file_name, /context/after_receipt/file_name]
      - [/context/before_receipt/file_size_bytes, /context/after_receipt/file_size_bytes]
      - [/context/before_receipt/sha256, /context/after_receipt/sha256]
      - [/context/before_receipt/scene_identity_sha256, /context/after_receipt/scene_identity_sha256]
  failed_unknown: {}
  timed_out: {}
  indeterminate: {}
