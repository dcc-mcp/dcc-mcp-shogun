        volume_serial: 00000000D4C3B2A1
        file_id: 99990000aaaabbbbccccddddeeeeffff
        disposition: reject_unapproved_reparse_or_device_identity
  recovery_receipt:
    version: recovery-receipt-json-v1
    members:
      - active_scene_changed
      - file_name
      - file_size_bytes
      - receipt_version
      - sha256
    string_normalization: unicode_nfc
    key_order: ascending_unicode_code_point
    encoding: utf-8
    ensure_ascii: false
    separators: [comma, colon]
    insignificant_whitespace: forbidden
    number_format: unsigned_base10_integer_without_leading_zero
    boolean_format: lowercase_json_literal
    digest: sha256
    golden_vectors:
      - name: unicode_filename_nfc
        receipt:
          receipt_version: 1
