tools:
  - name: import_motion
    description: Import one bounded BVH, C3D, or MCP file through the official Shogun SDK.
    source_file: scripts/import_motion.py
    input_schema:
      type: object
      required: [file_path]
      properties:
        file_path: {type: string, minLength: 1, maxLength: 4096}
        import_type:
          type: string
          enum: [selCreateNew, onlySelected, createNewAlways, mergeAll, mergeSelected, curClipCreateNew]
          default: selCreateNew
        create_second_figure: {type: boolean, default: false}
        max_file_bytes: {type: integer, minimum: 1, maximum: 2147483648, default: 536870912}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: true
      deferred_hint: true
    call_examples:
      - arguments:
          file_path: "C:/motion/anonymous.bvh"
          import_type: selCreateNew
        note: Import one operator-owned BVH as a new figure.
    next-tools:
      on-success: [shogun_scene__inspect_scene]
      on-failure: [shogun_scene__inspect_scene]

  - name: save_scene
    description: Save the current Shogun scene to one explicit VDF path.
    source_file: scripts/save_scene.py
    input_schema:
      type: object
      required: [file_path]
      properties:
        file_path: {type: string, minLength: 1, maxLength: 4096}
        overwrite: {type: boolean, default: false}
      additionalProperties: false
    output_schema:
      type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        prompt: {type: [string, "null"]}
        error: {type: "null"}
        context:
          type: object
          required: [receipt_version, file_name, file_size_bytes, sha256, active_scene_changed]
          properties:
            receipt_version: {type: integer, const: 1}
            file_name: {type: string, minLength: 1, maxLength: 4096}
            file_size_bytes: {type: integer, minimum: 1}
            sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
            active_scene_changed: {type: boolean}
          additionalProperties: false
      additionalProperties: false
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: true
      deferred_hint: true
    next-tools:
      on-success: [shogun_scene__inspect_scene]
      on-failure: [shogun_scene__inspect_scene]

  - name: export_motion
    description: Export the current Shogun scene to one explicit BVH, C3D, FBX, or MCP path.
    source_file: scripts/export_motion.py
    input_schema:
      type: object
      required: [file_path]
      properties:
        file_path: {type: string, minLength: 1, maxLength: 4096}
        overwrite: {type: boolean, default: false}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 180
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: true
      deferred_hint: true
    next-tools:
      on-success: [shogun_scene__inspect_scene]
      on-failure: [shogun_scene__inspect_scene]
