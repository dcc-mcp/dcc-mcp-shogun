tools:
  - name: inspect_scene
    description: Return a bounded, path-redacted snapshot of the active Shogun Post scene.
    source_file: scripts/inspect_scene.py
    input_schema:
      type: object
      properties:
        max_subjects: {type: integer, minimum: 1, maximum: 1000, default: 100}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_scene__list_markers, shogun_scene__list_bones]

  - name: list_markers
    description: List a bounded set of marker names for one explicit subject.
    source_file: scripts/list_markers.py
    input_schema:
      type: object
      required: [subject]
      properties:
        subject: {type: string, minLength: 1, maxLength: 512}
        max_markers: {type: integer, minimum: 1, maximum: 10000, default: 1000}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_scene__get_trajectory_at_frame]
      on-failure: [shogun_scene__inspect_scene]

  - name: list_bones
    description: List a bounded labeling or solving skeleton for one explicit subject.
    source_file: scripts/list_bones.py
    input_schema:
      type: object
      required: [subject, skeleton]
      properties:
        subject: {type: string, minLength: 1, maxLength: 512}
        skeleton: {type: string, enum: [Labeling, Solving]}
        max_bones: {type: integer, minimum: 1, maximum: 10000, default: 1000}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_scene__inspect_scene]

  - name: get_trajectory_at_frame
    description: Read one marker position at one explicit Shogun trial frame.
    source_file: scripts/get_trajectory_at_frame.py
    input_schema:
      type: object
      required: [subject, marker, frame]
      properties:
        subject: {type: string, minLength: 1, maxLength: 512}
        marker: {type: string, minLength: 1, maxLength: 512}
        frame: {type: integer, minimum: 0}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_scene__list_markers, shogun_scene__inspect_scene]

  - name: list_scene_objects
    description: List a bounded set of official Scene objects, optionally filtered by exact Vicon type.
    source_file: scripts/list_scene_objects.py
    input_schema:
      type: object
      properties:
        max_objects: {type: integer, minimum: 1, maximum: 10000, default: 500}
        object_type: {type: string, maxLength: 128, default: ""}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_scene__get_scene_object_details]
      on-failure: [shogun_scene__inspect_scene]

  - name: get_scene_object_details
    description: Read one explicit Scene object's hierarchy and transforms at one frame.
    source_file: scripts/get_scene_object_details.py
    input_schema:
      type: object
      required: [object_path, frame]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
        frame: {type: integer, minimum: 0, maximum: 2147483647}
        max_children: {type: integer, minimum: 1, maximum: 10000, default: 100}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_scene__list_scene_objects, shogun_scene__inspect_scene]

  - name: inspect_object_selection
    description: Read the bounded selected-object set and primary Scene object.
    source_file: scripts/inspect_object_selection.py
    input_schema:
      type: object
      properties:
        max_objects: {type: integer, minimum: 1, maximum: 10000, default: 500}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false

  - name: select_scene_object
    description: Select one explicit Scene object, replacing the existing selection by default.
    source_file: scripts/select_scene_object.py
    input_schema:
      type: object
      required: [object_path]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
        replace: {type: boolean, default: true}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_scene__inspect_object_selection]
      on-failure: [shogun_scene__list_scene_objects]

  - name: clear_object_selection
    description: Clear the official Scene object selection without changing motion data.
    source_file: scripts/clear_object_selection.py
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false

  - name: set_scene_object_display
    description: Set one or more allowlisted display properties on an explicit Scene object.
    source_file: scripts/set_scene_object_display.py
    input_schema:
      type: object
      required: [object_path]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
        showing: {type: boolean}
        selectable: {type: boolean}
        opacity: {type: number, minimum: 0, maximum: 1}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_scene__get_scene_object_details]
      on-failure: [shogun_scene__list_scene_objects]

  - name: get_bone_details
    description: Read the parent and a bounded child list for one explicit skeleton bone.
    source_file: scripts/get_bone_details.py
    input_schema:
      type: object
      required: [subject, bone, skeleton]
      properties:
        subject: {type: string, minLength: 1, maxLength: 512}
        bone: {type: string, minLength: 1, maxLength: 512}
        skeleton: {type: string, enum: [Labeling, Solving]}
        max_children: {type: integer, minimum: 1, maximum: 10000, default: 1000}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_scene__list_bones, shogun_scene__inspect_scene]

  - name: list_constraints
    description: List a bounded set of constraint names for one explicit subject skeleton.
    source_file: scripts/list_constraints.py
    input_schema:
      type: object
      required: [subject, skeleton]
      properties:
        subject: {type: string, minLength: 1, maxLength: 512}
        skeleton: {type: string, enum: [Labeling, Solving]}
        max_constraints: {type: integer, minimum: 1, maximum: 10000, default: 1000}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_scene__get_constraint_details]
      on-failure: [shogun_scene__inspect_scene]

  - name: get_constraint_details
    description: Read the active state, nodes, offset, and type of one skeleton constraint.
    source_file: scripts/get_constraint_details.py
    input_schema:
      type: object
      required: [subject, constraint, skeleton]
      properties:
        subject: {type: string, minLength: 1, maxLength: 512}
        constraint: {type: string, minLength: 1, maxLength: 512}
        skeleton: {type: string, enum: [Labeling, Solving]}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_scene__list_constraints, shogun_scene__inspect_scene]

  - name: list_subject_parameters
    description: List a bounded set of static parameter names for one subject skeleton.
    source_file: scripts/list_subject_parameters.py
    input_schema:
      type: object
      required: [subject, skeleton]
      properties:
        subject: {type: string, minLength: 1, maxLength: 512}
        skeleton: {type: string, enum: [Labeling, Solving]}
        max_parameters: {type: integer, minimum: 1, maximum: 10000, default: 1000}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_scene__get_subject_parameter]
      on-failure: [shogun_scene__inspect_scene]

  - name: get_subject_parameter
    description: Read one static subject parameter with its unit, default, and required state.
    source_file: scripts/get_subject_parameter.py
    input_schema:
      type: object
      required: [subject, parameter, skeleton]
      properties:
        subject: {type: string, minLength: 1, maxLength: 512}
        parameter: {type: string, minLength: 1, maxLength: 512}
        skeleton: {type: string, enum: [Labeling, Solving]}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_scene__list_subject_parameters, shogun_scene__inspect_scene]

  - name: get_trajectory_window
    description: Read an inclusive, bounded window of at most 2000 marker trajectory frames.
    source_file: scripts/get_trajectory_window.py
    input_schema:
      type: object
      required: [subject, marker, start_frame, end_frame]
      properties:
        subject: {type: string, minLength: 1, maxLength: 512}
        marker: {type: string, minLength: 1, maxLength: 512}
        start_frame: {type: integer, minimum: 0}
        end_frame: {type: integer, minimum: 0}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-failure: [shogun_scene__list_markers, shogun_scene__inspect_scene]

  - name: list_object_attributes
    description: List bounded attribute names for one object without returning private attribute values.
    source_file: scripts/list_object_attributes.py
    input_schema:
      type: object
      required: [object_path]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
        max_attributes: {type: integer, minimum: 1, maximum: 1000, default: 200}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false

  - name: list_object_channels
    description: List bounded channel names for one explicit Scene object.
    source_file: scripts/list_object_channels.py
    input_schema:
      type: object
      required: [object_path]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
        max_channels: {type: integer, minimum: 1, maximum: 1000, default: 200}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_scene__get_channel_sample, shogun_scene__list_channel_gaps]

  - name: get_channel_sample
    description: Read one named channel at one explicit frame and report whether it has a key.
    source_file: scripts/get_channel_sample.py
    input_schema:
      type: object
      required: [object_path, channel_name, frame]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
        channel_name: {type: string, minLength: 1, maxLength: 256}
        frame: {type: integer, minimum: 0, maximum: 2147483647}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_scene__list_object_channels]

  - name: list_channel_gaps
    description: Return a bounded list of gap ranges for one explicit object channel.
    source_file: scripts/list_channel_gaps.py
    input_schema:
      type: object
      required: [object_path, channel_name]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
        channel_name: {type: string, minLength: 1, maxLength: 256}
        any_subchannel: {type: boolean, default: false}
        max_gaps: {type: integer, minimum: 1, maximum: 2000, default: 200}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_scene__list_object_channels]

  - name: list_optical_cameras
    description: List a bounded inventory of official OpticalCamera Scene objects.
    source_file: scripts/list_optical_cameras.py
    input_schema:
      type: object
      properties:
        max_cameras: {type: integer, minimum: 1, maximum: 10000, default: 500}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_scene__get_optical_camera_details]

  - name: get_optical_camera_details
    description: Read stable calibration and capture fields for one camera without device identifiers.
    source_file: scripts/get_optical_camera_details.py
    input_schema:
      type: object
      required: [object_path]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_scene__list_optical_cameras]
