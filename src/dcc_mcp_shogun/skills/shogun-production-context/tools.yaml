tools:
  - name: get_clip_timing
    description: Read one explicit official Clip's timing and SMPTE state without editing NLE data.
    source_file: scripts/get_clip_timing.py
    input_schema:
      type: object
      required: [object_path]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_production_context__list_clips, shogun_scene__inspect_scene]

  - name: list_clips
    description: List bounded official Clip timing and SMPTE state without editing NLE data.
    source_file: scripts/list_clips.py
    input_schema:
      type: object
      properties:
        max_clips: {type: integer, minimum: 1, maximum: 10000, default: 500}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_scene__inspect_scene]

  - name: list_character_statuses
    description: List bounded Character shot-QA status without artist identities or notes.
    source_file: scripts/list_character_statuses.py
    input_schema:
      type: object
      properties:
        max_characters: {type: integer, minimum: 1, maximum: 10000, default: 500}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_scene__inspect_scene]

  - name: get_character_status
    description: Read one explicit Character's bounded shot-QA status without identities or notes.
    source_file: scripts/get_character_status.py
    input_schema:
      type: object
      required: [object_path]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_production_context__list_character_statuses, shogun_scene__inspect_scene]
