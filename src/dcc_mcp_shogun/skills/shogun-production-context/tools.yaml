tools:
  - name: get_clip_timing
    description: Read one explicit official Clip's timing and SMPTE state without editing NLE data.
    source_file: scripts/get_clip_timing.py
    input_schema:
      type: object
      required: [object_path]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_production_context__list_clips, shogun_scene__inspect_scene]

  - name: list_clips
    description: List bounded official Clip timing and SMPTE state without editing NLE data.
    source_file: scripts/list_clips.py
    input_schema:
      type: object
      properties:
        max_clips: {type: integer, minimum: 1, maximum: 10000, default: 500}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_scene__inspect_scene]

  - name: list_character_statuses
    description: List bounded Character shot-QA status without artist identities or notes.
    source_file: scripts/list_character_statuses.py
    input_schema:
      type: object
      properties:
        max_characters: {type: integer, minimum: 1, maximum: 10000, default: 500}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_scene__inspect_scene]

  - name: get_character_status
    description: Read one explicit Character's bounded shot-QA status without identities or notes.
    source_file: scripts/get_character_status.py
    input_schema:
      type: object
      required: [object_path]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-failure: [shogun_production_context__list_character_statuses, shogun_scene__inspect_scene]

  - name: get_active_clip
    description: Read the exact active Clip name without returning scene or media paths.
    source_file: scripts/get_active_clip.py
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_production_context__get_clip_timing]
      on-failure: [shogun_production_context__list_clips, shogun_scene__inspect_scene]

  - name: set_active_clip
    description: Activate one existing Clip by exact name with vendor read-back verification.
    source_file: scripts/set_active_clip.py
    input_schema:
      type: object
      required: [clip_name]
      properties:
        clip_name: {type: string, minLength: 1, maxLength: 512}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_production_context__get_active_clip]
      on-failure: [shogun_production_context__list_clips]

  - name: update_clip_timing
    description: Update an allowlisted Clip timing subset with vendor read-back verification and rollback.
    source_file: scripts/update_clip_timing.py
    input_schema:
      type: object
      required: [object_path]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
        locked: {type: boolean}
        start_frame: {type: number, minimum: -1000000000, maximum: 1000000000}
        clip_offset: {type: number, minimum: -1000000000, maximum: 1000000000}
        duration: {type: number, minimum: 0, maximum: 1000000000}
        time_scale: {type: number, minimum: 0.001, maximum: 1000}
        smpte_align_clip: {type: boolean}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_production_context__get_clip_timing]
      on-failure: [shogun_production_context__get_clip_timing, shogun_production_context__list_clips]

  - name: update_character_qa_status
    description: Update only allowlisted Character QA booleans with verification and rollback.
    source_file: scripts/update_character_qa_status.py
    input_schema:
      type: object
      required: [object_path]
      properties:
        object_path: {type: string, minLength: 1, maxLength: 2048}
        active: {type: boolean}
        shot_labeled: {type: boolean}
        shot_edited: {type: boolean}
        shot_approved: {type: boolean}
        shot_attached: {type: boolean}
        special_flag: {type: boolean}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_production_context__get_character_status]
      on-failure: [shogun_production_context__get_character_status, shogun_production_context__list_character_statuses]
