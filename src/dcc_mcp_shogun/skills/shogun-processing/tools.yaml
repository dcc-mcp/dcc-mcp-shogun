tools:
  - name: inspect_processing_settings
    description: Read a stable allowlist of reconstruct, solving, or occlusion settings.
    source_file: scripts/inspect_processing_settings.py
    input_schema:
      type: object
      required: [section]
      properties:
        section: {type: string, enum: [reconstruct, solving, occlusion, label_rom, labeling_calibration, circle_fit]}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false

  - name: reconstruct
    description: Reconstruct 2D camera data for only the current frame or selected time ranges.
    source_file: scripts/reconstruct.py
    input_schema:
      type: object
      required: [range_mode]
      properties:
        range_mode: {type: string, enum: [current_frame, selected_ranges]}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-success: [shogun_scene__inspect_scene]

  - name: auto_label
    description: Auto-label active or selected subjects for an explicit bounded time scope.
    source_file: scripts/auto_label.py
    input_schema:
      type: object
      required: [range_mode, subjects]
      properties:
        range_mode: {type: string, enum: [current_frame, selected_ranges]}
        subjects: {type: string, enum: [active, selected]}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-success: [shogun_scene__inspect_scene]

  - name: fix_occlusion
    description: Fix occlusion for active or selected subjects over an explicit bounded time scope.
    source_file: scripts/fix_occlusion.py
    input_schema:
      type: object
      required: [range_mode, subjects]
      properties:
        range_mode: {type: string, enum: [current_frame, selected_ranges]}
        subjects: {type: string, enum: [active, selected]}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-success: [shogun_scene__inspect_scene]

  - name: solve
    description: Apply active solvers for only the current frame or selected time ranges.
    source_file: scripts/solve.py
    input_schema:
      type: object
      required: [range_mode]
      properties:
        range_mode: {type: string, enum: [current_frame, selected_ranges]}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-success: [shogun_scene__inspect_scene]

  - name: retarget
    description: Retarget only the current frame or selected time ranges using the active setup.
    source_file: scripts/retarget.py
    input_schema:
      type: object
      required: [range_mode]
      properties:
        range_mode: {type: string, enum: [current_frame, selected_ranges]}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-success: [shogun_scene__inspect_scene]

  - name: label_rom
    description: Label a ROM for active or selected subjects at one frame or the explicit play range.
    source_file: scripts/label_rom.py
    input_schema:
      type: object
      required: [subjects, range_mode]
      properties:
        subjects: {type: string, enum: [active, selected]}
        range_mode: {type: string, enum: [current_frame, play_range]}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-success: [shogun_scene__inspect_scene]

  - name: calibrate_subjects
    description: Calibrate labeling or solving subjects over an explicit play or selected range.
    source_file: scripts/calibrate_subjects.py
    input_schema:
      type: object
      required: [skeleton, subjects, range_mode]
      properties:
        skeleton: {type: string, enum: [labeling, solving]}
        subjects: {type: string, enum: [active, selected]}
        range_mode: {type: string, enum: [play_range, selected_ranges]}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-success: [shogun_scene__inspect_scene]

  - name: quick_post
    description: Run one explicit QuickPost level for only the current frame or selected ranges.
    source_file: scripts/quick_post.py
    input_schema:
      type: object
      required: [process_level, range_mode]
      properties:
        process_level: {type: string, enum: [reconstruct, label, solve, retarget]}
        range_mode: {type: string, enum: [current_frame, selected_ranges]}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 600
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    next-tools:
      on-success: [shogun_scene__inspect_scene]

  - name: update_reconstruct_settings
    description: Update an allowlisted subset of official reconstruction settings with rollback on failure.
    source_file: scripts/update_reconstruct_settings.py
    input_schema:
      type: object
      properties:
        min_cameras_to_start: {type: integer, minimum: 2, maximum: 1000}
        min_cameras_to_continue: {type: integer, minimum: 2, maximum: 1000}
        min_radius: {type: number, minimum: 0, maximum: 1000000}
        max_radius: {type: number, minimum: 0, maximum: 1000000}
      minProperties: 1
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_processing__inspect_processing_settings]

  - name: update_occlusion_settings
    description: Update an allowlisted subset of official occlusion settings with rollback on failure.
    source_file: scripts/update_occlusion_settings.py
    input_schema:
      type: object
      properties:
        enabled: {type: boolean}
        apply_fixed_markers: {type: boolean}
        marker_smoothing: {type: number, minimum: 0, maximum: 1000000}
        data_fidelity: {type: number, minimum: 0, maximum: 1000000}
        transition_time: {type: number, minimum: 0, maximum: 1000000}
      minProperties: 1
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_processing__inspect_processing_settings]

  - name: update_solving_settings
    description: Update an allowlisted subset of official solving settings with rollback on failure.
    source_file: scripts/update_solving_settings.py
    input_schema:
      type: object
      properties:
        prior_importance: {type: number, minimum: 0, maximum: 1000000}
        mean_pose_ratio: {type: number, minimum: 0, maximum: 1000000}
        plausibility_importance: {type: number, minimum: 0, maximum: 1000000}
        thread_count: {type: integer, minimum: 1, maximum: 1024}
      minProperties: 1
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_processing__inspect_processing_settings]
