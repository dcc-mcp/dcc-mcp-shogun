tools:
  - name: inspect_timeline
    description: Read a bounded snapshot of the current Shogun timeline state.
    source_file: scripts/inspect_timeline.py
    input_schema:
      type: object
      properties:
        max_selected_ranges: {type: integer, minimum: 1, maximum: 1000, default: 100}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false

  - name: set_current_frame
    description: Move the Shogun timeline to one explicit non-negative frame.
    source_file: scripts/set_current_frame.py
    input_schema:
      type: object
      required: [frame]
      properties:
        frame: {type: integer, minimum: 0, maximum: 2147483647}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_timeline__inspect_timeline]

  - name: select_time_range
    description: Select one explicit ordered frame range, replacing existing ranges by default.
    source_file: scripts/select_time_range.py
    input_schema:
      type: object
      required: [start_frame, end_frame]
      properties:
        start_frame: {type: integer, minimum: 0, maximum: 2147483647}
        end_frame: {type: integer, minimum: 0, maximum: 2147483647}
        replace: {type: boolean, default: true}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_timeline__inspect_timeline, shogun_processing__inspect_processing_settings]

  - name: clear_time_selection
    description: Clear all selected time ranges without changing scene data.
    source_file: scripts/clear_time_selection.py
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false

  - name: set_play_range
    description: Set an explicit ordered Shogun play range with best-effort rollback on partial failure.
    source_file: scripts/set_play_range.py
    input_schema:
      type: object
      required: [start_frame, end_frame]
      properties:
        start_frame: {type: integer, minimum: 0, maximum: 2147483647}
        end_frame: {type: integer, minimum: 0, maximum: 2147483647}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    next-tools:
      on-success: [shogun_timeline__inspect_timeline]
