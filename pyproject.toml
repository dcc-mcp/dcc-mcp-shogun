[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-shogun"
version = "0.11.0"
description = "Typed DCC-MCP adapter for Vicon Shogun Post motion-capture workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loonghao", email = "hal.long@outlook.com" }]
keywords = ["vicon", "shogun", "motion-capture", "mcp", "dcc", "animation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = ["dcc-mcp-core>=0.19.86,<1.0.0"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.18",
  "pytest>=8",
  "PyYAML>=6.0",
  "ruff>=0.8",
  "twine>=6",
]

[project.scripts]
dcc-mcp-shogun = "dcc_mcp_shogun.server:main"

[project.entry-points."dcc_mcp.adapters"]
shogun = "dcc_mcp_shogun:ShogunMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_shogun"]
artifacts = ["src/dcc_mcp_shogun/skills/**"]

[tool.hatch.build.targets.sdist]
include = [
  "src/dcc_mcp_shogun",
  "tests",
  "tools",
  "docs",
  "examples",
  "README.md",
  "install.md",
  "LICENSE",
  "release-please-config.json",
  ".release-please-manifest.json",
]
exclude = ["docs/**/*.png", "docs/**/*.svg", "docs/**/*.webp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
